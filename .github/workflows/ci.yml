
name: Expense Tracker CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: expense_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: expense_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expense_user -d expense_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://expense_user:test_password@localhost:5432/expense_tracker_test
      APP_ENV: testing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Apply database migrations
        run: flask --app app db upgrade

      - name: Run automated tests and generate reports
        run: |
          python -m pytest -v \
            --junitxml=test-results.xml \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            test-results.xml
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 14

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t expense-tracker:latest .

  ecr-push:
    name: Push Docker Image to ECR
    runs-on: ubuntu-latest
    needs: [test, docker-build]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: swe40006-expensetracker
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" .

          docker push \
            "$REGISTRY/$REPOSITORY:$IMAGE_TAG"

      - name: Display pushed image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: swe40006-expensetracker
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Image pushed successfully:"
          echo "$REGISTRY/$REPOSITORY:$IMAGE_TAG"

  
  deploy-testing:
    name: Deploy to Testing EC2
    runs-on: ubuntu-latest
    needs: ecr-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Deploy using AWS SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
          INSTANCE_ID: i-0f35e94aeb67d8dd7
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"sudo /opt/expense-tracker-deploy.sh $IMAGE_TAG\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent}"
  
  e2e-testing:
    name: End to End Tests on Testing Environment
    runs-on: ubuntu-latest
    needs: deploy-testing

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      BASE_URL: http://3.104.55.176
      EXPECTED_ENV: testing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-e2e.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run end to end acceptance tests
        run: |
          python -m pytest e2e/ -v \
            --junitxml=e2e-results.xml \
            --screenshot=only-on-failure \
            --video=retain-on-failure \
            --output=e2e-artifacts

      - name: Upload end to end results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            e2e-results.xml
            e2e-artifacts/
          if-no-files-found: warn
          retention-days: 14

  deploy-staging:
    name: Deploy to Staging EC2
    runs-on: ubuntu-latest
    needs: e2e-testing

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: expense-tracker-staging
      cancel-in-progress: false

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Deploy to Staging through AWS SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
          INSTANCE_ID: i-0028420e56dc2faa6
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"sudo /opt/expense-tracker-deploy.sh $IMAGE_TAG\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then

            echo "Staging deployment did not complete successfully."

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
              --output json || true

            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json

  
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: expense-tracker-production
      cancel-in-progress: false

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Deploy to Production via SSM
        env:
          INSTANCE_ID: i-0b97f1c7ad53a2625
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "Deploying image: $IMAGE_TAG"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ExpenseTracker to Production" \
            --parameters "commands=[\"sudo /opt/expense-tracker/deploy.sh $IMAGE_TAG\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then
            echo "Production deployment did not complete successfully."

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
              --output json || true

            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json

          echo "Production deployment completed successfully."
