services:
  web:
    build: .
    container_name: expense-tracker-web
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      APP_ENV: development
      PORT: "5000"
      DATABASE_URL: postgresql+psycopg://expense_user:${POSTGRES_PASSWORD}@db:5432/expense_tracker
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/app/migrations

  db:
    image: postgres:17
    container_name: expense-tracker-db
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: expense_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_user -d expense_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: